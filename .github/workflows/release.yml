# Builds Encodr for both architectures, after the tests pass:
#   - the Arch package, in clean Arch containers (for Omarchy and Arch);
#   - an AppImage for every other distribution, built on an old Ubuntu so it
#     runs on anything newer (x86_64: 22.04; aarch64: 24.04, as Qt's arm64
#     binaries need it), then started on clean Ubuntu, Debian and Fedora to
#     convert a real clip.
# A pushed tag (v0.2.0) attaches everything to that release; running it by
# hand just leaves the files as downloads on the run.
#
# Arch Linux only publishes x86_64 images; the aarch64 package build uses
# menci/archlinuxarm, rebuilt daily from Arch Linux ARM's own packages.
name: Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: archlinux:base-devel
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: menci/archlinuxarm:base-devel
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    env:
      PACKAGER: martythedev-tech <martythedev@gmail.com>
    steps:
      # A font is needed for the burned-in timecode test; desktops always have one.
      # Containers can't apply pacman's download sandbox (Landlock), so it's off here.
      - name: Install build and test dependencies
        run: |
          grep -q '^DisableSandbox' /etc/pacman.conf || sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          pacman -Syu --noconfirm --needed git qt6-base qt6-declarative qt6-svg qt6-wayland ffmpeg xdg-desktop-portal libnotify ttf-dejavu

      - uses: actions/checkout@v4

      # makepkg refuses to run as root.
      - name: Make a build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Test
        run: sudo -u builder bin/test

      - name: Package
        run: |
          cd pkgbuild
          sudo -u builder --preserve-env=PACKAGER makepkg -f --noconfirm
          ls -l *.pkg.tar.*

      - uses: actions/upload-artifact@v4
        with:
          name: encodr-${{ matrix.arch }}
          path: pkgbuild/*.pkg.tar.*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pkgbuild/*.pkg.tar.*

  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            qt_arch: linux_gcc_64
            ffmpeg: linux64
          # Qt's arm64 binaries need glibc 2.38, so this one starts at Ubuntu 24.04.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            qt_arch: linux_gcc_arm64
            ffmpeg: linuxarm64
    runs-on: ${{ matrix.runner }}
    env:
      QT_VERSION: "6.11.3"
      FFMPEG: ffmpeg-n9.0-latest-${{ matrix.ffmpeg }}-gpl-shared-9.0
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libfontconfig1 libdbus-1-3 patchelf file desktop-file-utils fonts-dejavu-core python3-pip
          pip3 install --user aqtinstall

      # The official Qt binaries: newer than any distribution ships, and built
      # for an old enough glibc to run nearly everywhere.
      - name: Install Qt ${{ env.QT_VERSION }}
        run: |
          host=linux; [ "${{ matrix.arch }}" = aarch64 ] && host=linux_arm64
          python3 -m aqt install-qt --outputdir "$HOME/Qt" $host desktop "$QT_VERSION" ${{ matrix.qt_arch }}
          echo "QMAKE=$(ls -d "$HOME"/Qt/"$QT_VERSION"/*/bin/qmake)" >> "$GITHUB_ENV"

      - name: Fetch ffmpeg
        run: |
          curl -fsSL -o ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$FFMPEG.tar.xz"
          tar -xf ffmpeg.tar.xz -C "$RUNNER_TEMP"
          echo "FFMPEG_DIR=$RUNNER_TEMP/$FFMPEG" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/$FFMPEG/bin" >> "$GITHUB_PATH"

      - name: Test against this Qt
        run: bin/test

      - name: Build
        run: bin/build

      - name: Fetch linuxdeploy
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          for tool in linuxdeploy linuxdeploy-plugin-qt linuxdeploy-plugin-appimage; do
            curl -fsSL -o "$tool" "https://github.com/linuxdeploy/$tool/releases/download/continuous/$tool-${{ matrix.arch }}.AppImage"
            chmod +x "$tool"
          done
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Pack the AppImage
        env:
          ARCH: ${{ matrix.arch }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bin/appimage

      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: build/Encodr-*.AppImage

  # Start each AppImage on stock distributions and convert a clip with it.
  try:
    needs: appimage
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        distro: ["ubuntu:22.04", "ubuntu:24.04", "debian:12", "fedora:latest"]
        exclude:
          - { arch: aarch64, distro: "ubuntu:22.04" }
          - { arch: aarch64, distro: "debian:12" }
        include:
          - { arch: aarch64, distro: "debian:13" }
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: ${{ matrix.distro }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}

      # What any desktop already has: OpenGL, fonts, the X and Wayland client libraries.
      - name: Install a desktop's basics
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y libgl1 libegl1 libfontconfig1 \
              fonts-dejavu-core libxkbcommon0 libdbus-1-3 libglib2.0-0 libx11-6 libx11-xcb1 libxcb1 libfreetype6 libgpg-error0
          else
            dnf install -y mesa-libGL mesa-libEGL fontconfig dejavu-sans-fonts libxkbcommon dbus-libs glib2 \
              libX11 libX11-xcb libxcb freetype
          fi

      - name: Convert a clip
        run: |
          chmod +x Encodr-*.AppImage
          ./Encodr-*.AppImage --appimage-extract >/dev/null
          squashfs-root/usr/bin/ffmpeg -nostdin -loglevel error -f lavfi -i testsrc2=size=320x180:rate=25:duration=2 \
            -f lavfi -i sine=duration=2 -c:v prores_ks -c:a pcm_s16le clip.mov
          QT_QPA_PLATFORM=offscreen QT_FORCE_STDERR_LOGGING=1 ENCODR_START=1 ENCODR_SNAPSHOT="$PWD/window.png" \
            ENCODR_SNAPSHOT_DELAY=20000 HOME="$PWD/home" XDG_RUNTIME_DIR=/tmp squashfs-root/AppRun "$PWD/clip.mov"
          ls -l
          test -s window.png
          test -s clip_review.mp4
          squashfs-root/usr/bin/ffprobe -v error -show_entries stream=codec_name -of csv=p=0 clip_review.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: window-${{ matrix.arch }}-${{ strategy.job-index }}
          path: window.png

  release:
    needs: [package, try]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: appimage-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: Encodr-*.AppImage
