# Builds the Arch package for both architectures in clean containers, after
# the tests pass. A pushed tag (v0.1.0) attaches the packages to that
# release; running it by hand just leaves them as downloads on the run.
#
# Arch Linux only publishes x86_64 images; the aarch64 build uses
# menci/archlinuxarm, rebuilt daily from Arch Linux ARM's own packages.
name: Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: archlinux:base-devel
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: menci/archlinuxarm:base-devel
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    env:
      PACKAGER: martythedev-tech <martythedev@gmail.com>
    steps:
      # A font is needed for the burned-in timecode test; desktops always have one.
      - name: Install build and test dependencies
        run: pacman -Syu --noconfirm --needed git qt6-base qt6-declarative qt6-wayland ffmpeg xdg-desktop-portal libnotify ttf-dejavu

      - uses: actions/checkout@v4

      # makepkg refuses to run as root.
      - name: Make a build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Test
        run: sudo -u builder bin/test

      - name: Package
        run: |
          cd pkgbuild
          sudo -u builder --preserve-env=PACKAGER makepkg -f --noconfirm
          ls -l *.pkg.tar.*

      - uses: actions/upload-artifact@v4
        with:
          name: encodr-${{ matrix.arch }}
          path: pkgbuild/*.pkg.tar.*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pkgbuild/*.pkg.tar.*
